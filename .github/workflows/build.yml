name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Release
        run: |
          set -euo pipefail
          xcodebuild \
            -project Caffeinated.xcodeproj \
            -scheme Caffeinated \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      # Stage the .app under a parent folder and upload that folder — not a
      # pre-made zip. GitHub already wraps artifacts in a zip for download;
      # uploading Caffeinated.zip nested another zip of the same name, and
      # macOS Archive Utility then unwraps to a Contents folder instead of
      # Caffeinated.app. path must be the parent of the .app, not the .app
      # itself, or the zip root is Contents/ again.
      - name: Stage app
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/build/DerivedData/Build/Products/Release/Caffeinated.app"
          test -d "$APP"
          STAGE="$GITHUB_WORKSPACE/artifact"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/Caffeinated.app"
          test -x "$STAGE/Caffeinated.app/Contents/MacOS/Caffeinated"
          ls -laR "$STAGE/Caffeinated.app/Contents"

      - name: Upload Caffeinated.app
        uses: actions/upload-artifact@v4
        with:
          name: Caffeinated
          path: artifact
          include-hidden-files: true
          if-no-files-found: error
